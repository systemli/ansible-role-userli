---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install required packages
      ansible.builtin.apt:
        pkg:
          # base
          - acl
          - unzip
          # mariadb
          - mariadb-server
          - python3-mysqldb
          # apache
          - apache2
          # php
          - composer
          - libapache2-mod-php
          - php8.4-cli
          - php8.4-curl
          - php8.4-fpm
          - php8.4-gd
          - php8.4-mbstring
          - php8.4-mysql
          - php8.4-opcache
          - php8.4-xml
          - php8.4-zip
          - php8.4-ctype
          - php8.4-intl
          - php8.4-redis

    - name: DEBUG - check init system state
      ansible.builtin.shell: |
        echo "--- ps aux ---"
        ps aux
        echo "--- /proc/1/comm ---"
        cat /proc/1/comm
        echo "--- /run/systemd/system ---"
        stat /run/systemd/system || true
        echo "--- systemctl is-system-running ---"
        systemctl is-system-running || true
        echo "--- systemctl show mariadb ---"
        systemctl show mariadb || true
        echo "--- systemd-detect-virt ---"
        systemd-detect-virt || true
      register: debug_init_state
      changed_when: false
      failed_when: false

    - name: DEBUG - print init system state
      ansible.builtin.debug:
        var: debug_init_state.stdout_lines

    - name: Start and enable MariaDB
      ansible.builtin.command:
        cmd: systemctl enable --now mariadb
      changed_when: false

    - name: Set Apache listen port to 8080
      ansible.builtin.copy:
        dest: /etc/apache2/ports.conf
        content: |
          Listen 8080
        mode: "0644"

    - name: Configure Apache vhost for userli
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/userli.conf
        content: |
          <VirtualHost *:8080>
              ServerName localhost
              DocumentRoot /var/www/userli/public
              SetEnv APP_ENV prod
          </VirtualHost>
        mode: "0644"

    - name: Disable default Apache site
      ansible.builtin.command:
        cmd: a2dissite 000-default
      changed_when: false
      failed_when: false

    - name: Enable userli Apache site
      ansible.builtin.command:
        cmd: a2ensite userli
      changed_when: false

    - name: Restart Apache
      ansible.builtin.systemd:
        name: apache2
        state: restarted
