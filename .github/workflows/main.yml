---
name: Integration
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - ".*"
      - ".github/**"
      - "README.md"

jobs:
  integration:
    name: Integration
    uses: systemli/github-ansible-workflow/.github/workflows/ansible-integration-workflow.yaml@998371abb4f2b95d4cf6b78b1f978bad639a66e5 # v1.6.2
    with:
      disable-apparmor-mysql: true
      distros: '[ "debian13" ]'

  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-24.04
    needs: integration
    if: ${{ github.actor == 'systemli[bot]' && startsWith(github.event.pull_request.title,'Bump Userli to') }}
    steps:

      - name: Obtain Access Token
        id: access_token
        run: |
          TOKEN="$(npx obtain-github-app-installation-access-token ci ${{ secrets.SYSTEMLI_APP_CREDENTIALS_TOKEN }})"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Force merge pull request
        env:
          GH_TOKEN: ${{ steps.access_token.outputs.token }}
        run: |
          gh pr merge ${{ github.event.number }} --delete-branch --squash --admin
