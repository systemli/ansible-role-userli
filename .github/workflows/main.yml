---
name: Integration
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - ".*"
      - ".github/**"
      - "README.md"

jobs:
  integration:
    name: Integration
    uses: systemli/github-ansible-workflow/.github/workflows/ansible-integration-workflow.yaml@v1.6.1
    with:
      disable-apparmor-mysql: true
      distros: '[ "debian13" ]'
      # Override to explicitly boot systemd as PID 1. Without an explicit
      # command, the docker driver's config injection ends up losing the
      # image's own CMD (["/lib/systemd/systemd"]), so systemd never starts
      # and any systemd/systemctl-based task fails with
      # "Service is in unknown state".
      molecule-config: |
        ---
        driver:
          name: docker
        platforms:
          - name: instance
            image: "geerlingguy/docker-\$\{MOLECULE_DISTRO:-debian12\}-ansible:latest"
            command: "/lib/systemd/systemd"
            volumes:
              - /sys/fs/cgroup:/sys/fs/cgroup:rw
              - /var/lib/containerd
            cgroupns_mode: host
            privileged: true
            pre_build_image: true
        provisioner:
          name: ansible
          ansible_args:
            - --diff
          playbooks:
            converge: ../default/converge.yml
