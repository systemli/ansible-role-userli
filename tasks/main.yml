---
- name: Preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Ensure group is present
  ansible.builtin.group:
    name: "{{ userli_group }}"

- name: Ensure user is present
  ansible.builtin.user:
    name: "{{ userli_user }}"
    group: "{{ userli_group }}"

- name: Ensure installation directory exists
  ansible.builtin.file:
    group: root
    mode: "0755"
    owner: root
    path: "{{ userli_home }}"
    state: directory

- name: Download current release
  block:
    - name: Create tmpdir
      ansible.builtin.tempfile:
        state: directory
        suffix: "userli-{{ userli_version }}"
      register: _tmpdir

    - name: Ensure gnugpg is installed
      ansible.builtin.apt:
        name: gpg

    - name: Download release files
      ansible.builtin.get_url:
        url: "https://github.com/systemli/userli/releases/download/{{ userli_version }}/{{ item }}"
        dest: "{{ _tmpdir.path }}"
        mode: "0644"
        timeout: 20
      loop:
        - "userli-{{ userli_version }}.tar.gz"
        - "userli-{{ userli_version }}.tar.gz.sha512"
        - "userli-{{ userli_version }}.tar.gz.sha512.asc"
      when: not ansible_check_mode

    - name: Verify hashsum and gpg signature
      ansible.builtin.command:
        cmd: "{{ item }}"
        chdir: "{{ _tmpdir.path }}"
      loop:
        - "gpg --keyserver keys.openpgp.org --recv-keys {{ userli_signing_fingerprint }}"
        - "gpg --verify userli-{{ userli_version }}.tar.gz.sha512.asc userli-{{ userli_version }}.tar.gz.sha512"
        - "sha512sum -c userli-{{ userli_version }}.tar.gz.sha512"
      environment:
        gnupghome: "{{ _tmpdir.path }}"
      register: _cmd
      loop_control:
        break_when: _cmd.rc != 0
      failed_when: _cmd.rc != 0
      changed_when: false
      when: not ansible_check_mode

# TODO: Chown app files as root:root for better security
#       Only var/cache should be owned by userli user
    - name: Unarchive release tarball to installation dir
      ansible.builtin.unarchive:
        src: "{{ _tmpdir.path }}/userli-{{ userli_version }}.tar.gz"
        dest: "{{ userli_home }}/"
        owner: "{{ userli_user }}"
        group: "{{ userli_user }}"
        remote_src: true
      when:
        - not ansible_check_mode

  rescue:
    - name: Failed to validate release tarball
      ansible.builtin.debug:
        var: _cmd.stderr
      when: _cmd is defined and _cmd.rc != 0

  always:
    - name: Remove temporary download dir
      ansible.builtin.file:
        path: "{{ _tmpdir.path }}"
        state: absent

- name: Update permissions for release directory
  ansible.builtin.file:
    dest: "{{ userli_home }}/userli-{{ userli_version }}"
    state: directory
    owner: "{{ userli_user }}"
    group: "{{ userli_user }}"
    mode: "0755"

- name: Update permissions for documentroot
  ansible.builtin.file:
    dest: "{{ userli_home }}/userli-{{ userli_version }}/public"
    state: directory
    owner: "{{ userli_user }}"
    group: "{{ userli_user }}"
    mode: "0750"

- name: Ensure .env.local is installed
  ansible.builtin.copy:
    content: |
      {% for var in userli_env_vars %}
      {{ var.name }}='{{ var.value }}'
      {% endfor %}
    dest: "{{ userli_home }}/userli-{{ userli_version }}/.env.local"
    owner: "{{ userli_user }}"
    group: "{{ userli_user }}"
    mode: "0640"
  notify: Dump environment for better performance

- name: Ensure extra directories are latest
  ansible.builtin.file:
    dest: "{{ userli_home }}/userli-{{ userli_version }}/{{ item.path }}"
    state: directory
    owner: "{{ userli_user }}"
    group: "{{ userli_user }}"
    mode: "0755"
  with_community.general.filetree: "{{ userli_directory }}"
  when: item.state == 'directory'

- name: Ensure extra files are latest
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ userli_home }}/userli-{{ userli_version }}/{{ item.path }}"
    owner: "{{ userli_user }}"
    group: "{{ userli_user }}"
    mode: "0644"
  with_community.general.filetree: "{{ userli_directory }}"
  when: item.state == 'file'

- name: Set link to current release
  ansible.builtin.file:
    state: link
    path: "{{ userli_symfony_path }}"
    src: "userli-{{ userli_version }}"
  notify: Restart webserver

- name: Import tasks for DB primary
  ansible.builtin.import_tasks: primary.yml
  when: userli_primary | bool

- name: Remove obsolete logrotate config
  ansible.builtin.file:
    path: /etc/logrotate.d/userli
    state: absent

- name: Configure systemd services
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - userli-scheduler.service
    - userli-worker.service
  notify:
    - Reload systemd daemon
    - Restart userli services

- name: Import deployment tasks
  ansible.builtin.import_tasks: deployment.yml
  when: userli_update | bool

- name: Import metrics tasks
  ansible.builtin.import_tasks: metrics.yml
  when: userli_prometheus_textfile_collector_enabled | bool

- name: Enable and start userli services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - userli-scheduler.service
    - userli-worker.service
