---

- name: Ensure group is present
  ansible.builtin.group:
    name: "{{ userli_group }}"

- name: Ensure user is present
  ansible.builtin.user:
    name: "{{ userli_user }}"
    group: "{{ userli_group }}"

- name: Ensure installation directory exists
  ansible.builtin.file:
    group: root
    mode: "0755"
    owner: root
    path: "{{ userli_home }}"
    state: directory

- name: Download current release
  when: >
    __userli_current_release.stat.exists is false or
    (__userli_current_release.stat.lnk_target | default('') | basename) != "userli-" + userli_version
  block:
    - name: Create tmpdir
      ansible.builtin.tempfile:
        state: directory
        suffix: "userli-{{ userli_version }}"
      register: _tmpdir
      check_mode: false

    - name: Ensure gnupg is installed
      ansible.builtin.apt:
        name: gpg
        install_recommends: true

    - name: Download release files
      ansible.builtin.get_url:
        url: "https://github.com/systemli/userli/releases/download/{{ userli_version }}/{{ item }}"
        dest: "{{ _tmpdir.path }}"
        mode: "0644"
        timeout: 20
      loop:
        - "userli-{{ userli_version }}.tar.gz"
        - "userli-{{ userli_version }}.tar.gz.sha512"
        - "userli-{{ userli_version }}.tar.gz.sha512.asc"
      when: not ansible_check_mode

    - name: Verify hashsum and gpg signature
      ansible.builtin.command:
        cmd: "{{ item }}"
        chdir: "{{ _tmpdir.path }}"
      loop:
        - "gpg --no-default-keyring --keyring ./keyring.gpg --keyserver keys.openpgp.org --recv-keys {{ userli_signing_fingerprint }}"
        - "gpgv --keyring ./keyring.gpg userli-{{ userli_version }}.tar.gz.sha512.asc userli-{{ userli_version }}.tar.gz.sha512"
        - "sha512sum -c userli-{{ userli_version }}.tar.gz.sha512"
      loop_control:
        break_when: _cmd.rc is defined and _cmd.rc != 0
      environment:
        GNUPGHOME: "{{ _tmpdir.path }}"
      register: _cmd
      changed_when: false
      when: not ansible_check_mode

    # TODO: Chown app files as root:root for better security
    #       Only var/cache should be owned by userli user
    - name: Unarchive release tarball to installation dir
      ansible.builtin.unarchive:
        src: "{{ _tmpdir.path }}/userli-{{ userli_version }}.tar.gz"
        dest: "{{ userli_home }}"
        owner: "{{ userli_user }}"
        group: "{{ userli_user }}"
        remote_src: true
      when:
        - not ansible_check_mode

  always:
    - name: Remove temporary download dir
      ansible.builtin.file:
        path: "{{ _tmpdir.path }}"
        state: absent

- name: Update permissions for release directory
  ansible.builtin.file:
    dest: "{{ userli_home }}/userli-{{ userli_version }}"
    state: directory
    owner: "{{ userli_user }}"
    group: "{{ userli_user }}"
    mode: "0755"

- name: Update permissions for documentroot
  ansible.builtin.file:
    dest: "{{ userli_home }}/userli-{{ userli_version }}/public"
    state: directory
    owner: "{{ userli_user }}"
    group: "{{ userli_user }}"
    mode: "0750"

- name: Ensure .env.local is installed
  ansible.builtin.copy:
    content: |
      {% for var in userli_env_vars %}
      {{ var.name }}='{{ var.value }}'
      {% endfor %}
    dest: "{{ userli_home }}/userli-{{ userli_version }}/.env.local"
    owner: "{{ userli_user }}"
    group: "{{ userli_user }}"
    mode: "0640"
  notify: Dump environment for better performance

- name: Ensure extra directories are latest
  ansible.builtin.file:
    dest: "{{ userli_home }}/userli-{{ userli_version }}/{{ item.path }}"
    state: directory
    owner: "{{ userli_user }}"
    group: "{{ userli_user }}"
    mode: "0755"
  with_community.general.filetree: "{{ userli_directory }}"
  when: item.state == 'directory'

- name: Ensure extra files are latest
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ userli_home }}/userli-{{ userli_version }}/{{ item.path }}"
    owner: "{{ userli_user }}"
    group: "{{ userli_user }}"
    mode: "0644"
  with_community.general.filetree: "{{ userli_directory }}"
  when: item.state == 'file'

- name: Set link to current release
  ansible.builtin.file:
    state: link
    path: "{{ userli_symfony_path }}"
    src: "userli-{{ userli_version }}"
  notify: Restart webserver
